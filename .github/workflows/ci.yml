name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  deploy:
    name: Deploy to Render
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_PORTFOLIO" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PORTFOLIO" > /dev/null
            echo "Render deploy triggered."
            echo "Render deploy triggered for ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            # O job continua verde (o CI em si passou), mas o aviso fica visível na execução.
            echo "::warning title=Render deploy skipped::Secret RENDER_DEPLOY_HOOK_PORTFOLIO is not set, so Render was NOT notified and the site was not updated. See README > Deploy."
            echo "### Render deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret \`RENDER_DEPLOY_HOOK_PORTFOLIO\` is not set, so Render was not notified. Add it in Settings > Secrets and variables > Actions (see README > Deploy)." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          RENDER_DEPLOY_HOOK_PORTFOLIO: ${{ secrets.RENDER_DEPLOY_HOOK_PORTFOLIO }}
